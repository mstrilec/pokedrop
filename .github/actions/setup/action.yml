name: Setup
description: Install pnpm and Node, restore the pnpm store cache, install dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        # After pnpm is installed, or the pnpm store cache cannot be located.
        node-version-file: package.json
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        HUSKY: '0'
