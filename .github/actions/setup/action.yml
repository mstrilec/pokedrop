name: Setup
description: Install pnpm and Node, restore the pnpm store cache, install dependencies.

runs:
  using: composite
  steps:
    # No version here on purpose: the action reads packageManager from
    # package.json, so the pnpm version cannot drift from the local one.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        # Reads engines.node, for the same reason. Must come after pnpm is
        # installed, or the pnpm store cache cannot be located.
        node-version-file: package.json
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        # `prepare` runs husky on every install. Installing git hooks into a
        # runner that will be destroyed in two minutes is pure waste.
        HUSKY: '0'
