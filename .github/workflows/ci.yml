name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pokedrop
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pokedrop_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pokedrop:ci@localhost:5432/pokedrop_ci
      SHADOW_DATABASE_URL: postgresql://pokedrop:ci@localhost:5432/pokedrop_shadow
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The shadow database has to exist before the diff can replay into it.
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE pokedrop_shadow'

      - name: Migration history applies from scratch
        run: pnpm --filter @pokedrop/api exec prisma migrate deploy

      - name: Schema and migration history agree
        run: >-
          pnpm --filter @pokedrop/api exec prisma migrate diff
          --from-migrations ./prisma/migrations
          --to-schema ./prisma/schema.prisma
          --exit-code
