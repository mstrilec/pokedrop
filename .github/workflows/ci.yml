name: CI

# Pushes are the real signal: this repository has no pull requests, work goes
# straight to dev and main is production. pull_request is listed anyway — it
# costs nothing while none exist, and covers the day one is opened.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A second push supersedes the first; there is no point paying for a run
# nobody will read. Never cancel on main, where each run is a record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
