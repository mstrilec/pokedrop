# PokeDrop in production, on one host. Used only through deploy/deploy.sh,
# which passes --env-file .env.production. docs/Deployment.md has the details.
#
# Nothing listens on the network: the web server is published on 127.0.0.1
# only, and Tailscale Funnel on the host is the way in. Docker's port
# publishing bypasses ufw, so a 0.0.0.0 mapping here would be open to the LAN
# whatever the firewall says.
#
# The host also runs game servers. Every service has a memory limit and half
# the default CPU weight, so under contention they get the CPU first.

name: pokedrop-prod

x-defaults: &defaults
  restart: unless-stopped
  cpu_shares: 512
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-api-image: &api-image
  image: pokedrop-api
  build:
    context: .
    target: api
  env_file: .env.production

services:
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '']
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The release step, never started by `up`: deploy.sh runs it once before the
  # new API serves traffic. The application itself never migrates.
  migrate:
    <<: *api-image
    profiles: [release]
    restart: 'no'
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*defaults, *api-image]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: [*defaults, *api-image]
    command: ['node', 'dist/worker']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m

  web:
    <<: *defaults
    image: pokedrop-web
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
      WEB_ORIGIN: ${WEB_BASE_URL}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - web-image-cache:/app/apps/web/.next/cache/images
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sign-in').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  web-image-cache:
